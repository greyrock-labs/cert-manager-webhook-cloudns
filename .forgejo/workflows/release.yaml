---
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build and publish
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        # -count=5 because the TXT lookup tests iterate a map, and Go
        # randomises map order -- a single run can pass by luck.
        run: go test ./cloudns/... -count=5

      - name: Log in to GHCR
        uses: https://github.com/docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generate image tags and labels
        id: meta
        uses: https://github.com/docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/greyrock-labs/cert-manager-webhook-cloudns
          # Must be the GitHub URL, not the Forgejo one -- this is what links
          # the package to the repo. metadata-action would otherwise derive it
          # from the Forgejo server URL, which GHCR cannot resolve.
          labels: |
            org.opencontainers.image.source=https://github.com/greyrock-labs/cert-manager-webhook-cloudns
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: https://github.com/docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: image-all
          push: true

      - name: Set up Helm
        uses: https://github.com/azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and push chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package deploy/cert-manager-webhook-cloudns \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist
          helm push "dist/cert-manager-webhook-cloudns-${VERSION}.tgz" \
            oci://ghcr.io/greyrock-labs/helm
