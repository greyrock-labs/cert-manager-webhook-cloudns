---
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build and publish
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the chart version is still the placeholder
        # Chart.yaml's version is deliberately not maintained -- helm package
        # below overrides it with --version/--app-version from the tag, so the
        # file's own value never reaches a published chart. It is pinned to
        # 0.0.0 so that a `helm template` from a checkout renders an
        # unpullable image tag and fails loudly, rather than silently
        # deploying whatever release the number last happened to match.
        # If someone writes a real version in, that guarantee is gone -- so
        # stop here, before anything expensive runs.
        env:
          PLACEHOLDER: 0.0.0
          CHART: deploy/cert-manager-webhook-cloudns/Chart.yaml
        run: |
          version=$(awk '/^version:/ { print $2 }' "${CHART}" | tr -d '"')
          app_version=$(awk '/^appVersion:/ { print $2 }' "${CHART}" | tr -d '"')

          rc=0
          if [ "${version}" != "${PLACEHOLDER}" ]; then
            echo "${CHART}: version is '${version}', expected the placeholder '${PLACEHOLDER}'"
            rc=1
          fi
          if [ "${app_version}" != "${PLACEHOLDER}" ]; then
            echo "${CHART}: appVersion is '${app_version}', expected the placeholder '${PLACEHOLDER}'"
            rc=1
          fi

          if [ "${rc}" -ne 0 ]; then
            echo
            echo "The git tag is the only version input; do not hand-edit Chart.yaml"
            echo "to cut a release. Reset both fields to ${PLACEHOLDER} and tag instead."
            exit 1
          fi

          echo "${CHART}: version and appVersion are both ${PLACEHOLDER}"

      - name: Set up Go
        uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        # -count=5 because the TXT lookup tests iterate a map, and Go
        # randomises map order -- a single run can pass by luck.
        run: go test ./cloudns/... -count=5

      - name: Log in to GHCR
        uses: https://github.com/docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image tags and labels
        id: meta
        uses: https://github.com/docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/greyrock-labs/cert-manager-webhook-cloudns
          # Must be the GitHub URL, not the Forgejo one -- this is what links
          # the package to the repo. metadata-action would otherwise derive it
          # from the Forgejo server URL, which GHCR cannot resolve.
          labels: |
            org.opencontainers.image.source=https://github.com/greyrock-labs/cert-manager-webhook-cloudns
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: https://github.com/docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: image-all
          push: true

      - name: Set up Helm
        uses: https://github.com/azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and push chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package deploy/cert-manager-webhook-cloudns \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist
          helm push "dist/cert-manager-webhook-cloudns-${VERSION}.tgz" \
            oci://ghcr.io/greyrock-labs/helm
